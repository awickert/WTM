# tests/taper -- THE CONFIG STUDIES A AND B RUN.
#
# A REAL FILE, not a generator's output (#83). Every setting the run resolves to is stated below.
#
# PROVENANCE: (none) = the suite chose it; # baseline = the model default owned once in
# tests/CONFIG_BASELINE.md; # <reason> = the model default, examined for THIS suite and owned here.
#
# WHAT STUDIES A AND B MEASURE: the surface-transition taper on the Anderson path -- (A) that the
# result is IDENTICAL across MPI rank counts to DET_RTOL 1e-9, and (B) that the water table varies
# SMOOTHLY across the open-water-evaporation sweep that crosses owe = precip. This is the
# SURFACE_SINK_DESIGN sec 14d experiment sequence made into an assertion.
#
# THE ARMS DIFFER IN THE FIXTURE, NOT IN THIS FILE. Each owe value in OWE_SWEEP is a different
# open_water_evaporation raster written by write_fixture(); the config is identical on every arm.
# The only per-arm substitutions are paths (@INPUTS@, @WORK@, @STEM@).
#
# Study C is a DIFFERENT experiment -- an arid drawdown with routing off -- and has its own file,
# config_arid.yaml. The two were one generator body with an override merge; they are two files now
# because they differ in eight keys, including whether the FSM runs at all.
run:
  type: equilibrium
  equilibrium_stop:
    tol: 0.001   # THE MODEL DEFAULT, and NOT what this suite intends -- see the note at the foot of
                 # this file and task #95. Stated here because it is what the run actually resolves to.
    metric: frac   # the auto-stop metric. See the tol note -- this suite does not intend to auto-stop at all
    frac: 0.001   # as above: a dial on an auto-stop this suite does not intend to use
  initial_water_table: supplied
time:
  total: "10yr"
  report_interval: "2"
  save_every_n_reports: 9999
transmissivity:
  fdepth:
    a: 200
    b: 150
    fmin: 2
  additive_background_transmissivity: 0   # baseline (tests/CONFIG_BASELINE.md)
surface_water:
  routing: continuous   # the FSM runs, coupled continuously (what an absent key resolves to). Study A
                        # needs the FSM ON: the taper acts where the table meets the surface
  runoff_ratio: 0
  infiltration_during_flow: false
  collection:
    method: active_set
boundaries:
  land: neumann_toposlope
solver:
  method: anderson
  time_integration: tr-bdf2   # what `anderson` resolves to; identical on every arm
  tolerance: 1e-10
  max_iterations: 10000   # baseline (tests/CONFIG_BASELINE.md)
  t_bar: false   # off -- this suite does not exercise step-averaged transmissivity
  convergence:
    metric: volume   # the per-solve step judged in WATER (#61), the shipped default
    water_volume_tol: 1e-08   # the shipped per-solve water tolerance
  smoothing:
    ksat_surface: 0   # baseline (tests/CONFIG_BASELINE.md)
    ksat_soilbottom: 0   # baseline (tests/CONFIG_BASELINE.md)
    storativity_surface: 0.01   # baseline (tests/CONFIG_BASELINE.md)
  anderson:
    restart:
      enabled: false   # baseline (tests/CONFIG_BASELINE.md)
      rho: 0.9   # baseline (tests/CONFIG_BASELINE.md)
      patience: 2   # baseline (tests/CONFIG_BASELINE.md)
      max_it: 40   # baseline (tests/CONFIG_BASELINE.md)
      max_restarts: 30   # baseline (tests/CONFIG_BASELINE.md)
  time_step:
    mode: fixed   # LOAD-BEARING, see the DET_RTOL note in taper_test.py: the 1e-9 bound is a
                  # MEASURED floor under fixed dt (4.18e-09 -> 8.63e-10 -> 8.63e-10 at stol 1e-8 /
                  # 1e-10 / 1e-12). Under adaptive stepping that floor is gone and the cross-rank
                  # difference moves erratically, up to ~100x, not reducible by tightening the solve.
    dt: 31536000
    error_tol: 0.1   # the resolved value. INERT under mode: fixed -- nothing steers on it here
dev:
  storage_form: volume   # exact dV rather than the secant approximation
  under_relaxation: 1   # baseline (tests/CONFIG_BASELINE.md)
parallel:
  threads_per_rank: 1   # baseline (tests/CONFIG_BASELINE.md)
evaporation:
  et_sigmoid:
    wtd_center: 0.05   # PARAMETERISES THE SUBJECT: the surface-transition taper's sigmoid centre
    logistic_width: 0.1   # PARAMETERISES THE SUBJECT: the surface-transition taper's sigmoid width
  extinction_depth: 8   # gates the depth_extinction taper, on below. Study C is where d_ext is varied
  tapers:
    surface_transition: true
    depth_extinction: true   # SHIPPED-ON. Both tapers are on here, as the shipped configuration
io:
  source: '@INPUTS@'
  region: 'taper_test'
  time_start: 't0'
  time_end: 't0'
output:
  outfile_prefix: '@WORK@/@STEM@_'
  run_log: '@WORK@/@STEM@.txt'
  trace: []
  verbosity: normal   # baseline (tests/CONFIG_BASELINE.md)
  directory: '@WORK@/@STEM@_prov'
  if_exists: overwrite

# ---------------------------------------------------------------------------------------------------
# THE eq_tol NOTE (task #95). taper_test.py still carries the comment
#     "-wtm_eq_tol 0: run the full fixed cycle count (cross-rank determinism check; do not auto-stop)"
# but nothing sets it any more: the flag went when the tapers became config keys, and TAPER_FLAGS is
# now empty. Study A therefore runs with the model default tol: 0.001 and DOES auto-stop -- measured,
# 4 logged cycles rather than the full 5. It stopped at the SAME cycle at n=1 and n=2 on this fixture,
# so the suite is passing, but it is passing for a reason nothing guarantees: an auto-stop is a global
# reduction whose firing cycle can differ by decomposition, and a determinism check that compares runs
# of DIFFERENT length is comparing the wrong thing. tests/mpi_consistency pins tol: 0 for exactly this.
# Restoring tol: 0 CHANGES WHAT STUDY A MEASURES (5 cycles, not 4), so it is a decision, not a
# materialisation -- this file states the value the run truly uses and #95 carries the choice.
