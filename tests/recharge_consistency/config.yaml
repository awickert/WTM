# tests/recharge_consistency -- THE CONFIG THIS SUITE RUNS.
#
# A REAL FILE, not a generator's output (#83). Every setting the run resolves to is stated below.
#
# PROVENANCE: (none) = the suite chose it; # baseline = the model default owned once in
# tests/CONFIG_BASELINE.md; # <reason> = the model default, examined for THIS suite and owned here.
#
# WHAT THIS SUITE MEASURES: three TIME-INTEGRATION SCHEMES must agree as dt refines. Six arms: three
# schemes x {coarse dt = 1 wk, fine dt = 0.25 wk}.
#
# A VACUOUS ARM WAS FOUND HERE BY WRITING THE KEYS DOWN (#83, 2026-09-10). The `cc` arm -- named for
# backward-Euler, the CONTROL of the whole comparison -- left solver.time_integration ABSENT, and an
# absent integrator resolves to tr-bdf2 on the Anderson path. Measured directly: absent -> tr-bdf2.
# So `cc` and `tr` were the SAME SCHEME, and a three-scheme agreement test was really a two-scheme one
# with one comparison against itself. It passed. It is now stated as backward-euler, which is what the
# arm's name has always claimed. (#24's class, and #37's: coverage is whatever suites DECLARE.)
#
# TWO KEYS VARY PER ARM: solver.time_integration and solver.time_step.dt. save_every_n_reports used to
# vary too, "scaled inversely so both dt cover the same simulated time" -- a hand-computed trick that was
# WRONG, and is now unnecessary because report_interval is stated as a TIME (see the time: block).
#
# THE SUITE WAS VACUOUS A SECOND WAY (#34, 2026-09-11), and this one survived the key-writing pass above.
# time.total was 241920000s = 400 WEEKS, while run.sh's comment claimed "T_end = 8 weeks" -- the "8 cyc /
# 32 cyc" in that comment are REPORTS, not weeks. The interior saturates around week 18, after which
# collection.method: active_set pinned all 196 interior cells at EXACTLY wtd = 0 and held them there for
# 380 more weeks. The comparison was taken at week 400, between three bit-identical zero fields: measured
# 0 of 256 cells nonzero in every final raster, cc-tr = cc-bdf2v = tr-bdf2v = 0.0000 m, PASS.
#
# solver.time_step.mode: fixed IS PINNED: the arms ARE a known coarse/fine dt pair, and a controller
# free to resize dt would collapse that contrast and leave the comparison at no particular dt.
#
# TOKENS substituted by run.sh: @INPUTS@, @WORK@, @STEM@, @INTEG@, @DT@.

run:
  type: transient
  equilibrium_stop:
    tol: 0   # the early stop is DISABLED: the arms are a fixed coarse/fine CYCLE COUNT, and stopping
             # early would break the equal-simulated-time pairing the comparison rests on.
    metric: frac   # UNSTATED: nobody chose this -- decide it for this suite
    frac: 0.001   # UNSTATED: nobody chose this -- decide it for this suite
  initial_water_table: saturated
time:
  # 20 WEEKS, AND THE NUMBER IS THE POINT. The interior starts at wtd = -2 m and rises under uniform
  # recharge; measured report by report, it reaches the land surface between week 17 and week 18. The run
  # ends at week 20, so the surface CROSSING IS STRICTLY INSIDE the integrated interval and every interior
  # cell has passed through it. That is the regime this suite exists to pin -- the storativity that scales
  # recharge changes across wtd = 0, and it is where backward-Euler (secant) and TR-BDF2/BDF2-on-V
  # (tangent) used to land ~3.7 m apart.
  #
  # Why not 17: measured, the field at week 17 is -0.055 to -0.045 m, entirely BELOW the surface. Stopping
  # there integrates a purely sub-surface transient and never touches the discontinuity. Why not 400 (what
  # it was): by then the domain has saturated and gone still, and there is nothing left to compare.
  #
  # The whole domain crosses within about a tenth of a week, so no report straddles the surface; the choice
  # is before or after, and after is the one that exercises the subject. |cc - tr| by week, in head:
  #   wk 8 = 5.35e-04   wk 16 = 1.08e-03   [crossing]   wk 18 = 3.30e-04   wk 20 = 3.43e-04   wk 26 = 4.48e-04
  total: "12096000s"
  # A TIME, NOT A STEP COUNT. Stated as a duration, both dt arms report at the SAME simulated times by
  # construction. It was "50" (steps), which made a report 50 wk on the coarse arm and 12.5 wk on the
  # fine one, and forced save_every_n_reports to be hand-scaled per arm to compensate.
  report_interval: "604800s"
  save_every_n_reports: 20   # the last report is the comparison point; 20 reports of 1 wk = the 20 wk above
transmissivity:
  fdepth:
    a: 200
    b: 150
    fmin: 2
  additive_background_transmissivity: 0   # baseline (tests/CONFIG_BASELINE.md)
surface_water:
  routing: off
  runoff_ratio: 0
  collection:
    # off, AND THE CHOICE IS LOAD-BEARING. This was active_set. active_set enforces wtd <= 0, so a cell
    # that would rise above the land surface is PINNED there -- which means the surface crossing this
    # suite exists to test is UNREACHABLE under it. Measured: over 25 reports, `n cells with wtd > 0`
    # was 0 at every single report; all 196 interior cells crossed together over weeks 17-20 and landed
    # on exactly 0. There was nothing left for three integrators to disagree about.
    #
    # The old comment's rationale -- "identical on every arm, so the scheme comparison is not confounded
    # by a different surface constraint" -- is satisfied by ANY constant collector, and `off` satisfies
    # it while leaving the subject reachable. With `off` the interior crosses at week 17-18 and the
    # schemes separate (see the time: block for the measured |cc - tr| by week).
    #
    # This does NOT drop active_set coverage of the scheme question: tests/combination_sweep runs all
    # four collectors x four integrators x two run types (86 arms), and budget_closure carries
    # active_set arms directly. What is not covered anywhere else is the surface crossing, which is why
    # this suite takes it.
    method: off
  infiltration_during_flow: false
boundaries:
  land: neumann_toposlope
solver:
  method: anderson
  time_integration: @INTEG@   # PER-ARM: backward-euler | tr-bdf2 | bdf2 -- THE SUBJECT
  tolerance: 1e-8
  max_iterations: 10000   # baseline (tests/CONFIG_BASELINE.md)
  t_bar: false   # off -- this suite does not exercise step-averaged transmissivity
  convergence:
    metric: volume   # the per-solve step judged in WATER (#61), the shipped default
    water_volume_tol: 1e-08   # the shipped per-solve water tolerance
    residual_gate: 1e-05   # baseline (tests/CONFIG_BASELINE.md). #104: the water-step verdict is
                           # REFUSED while the residual is above this x its initial value -- a
                           # relative step test cannot tell a converged solve from a stalled one.
  smoothing:
    ksat_surface: 0   # baseline (tests/CONFIG_BASELINE.md)
    ksat_soilbottom: 0   # baseline (tests/CONFIG_BASELINE.md)
    storativity_surface: 0.01   # baseline (tests/CONFIG_BASELINE.md)
  anderson:
    restart:
      enabled: false   # baseline (tests/CONFIG_BASELINE.md)
      rho: 0.9   # baseline (tests/CONFIG_BASELINE.md)
      patience: 2   # baseline (tests/CONFIG_BASELINE.md)
      max_it: 40   # baseline (tests/CONFIG_BASELINE.md)
      max_restarts: 30   # baseline (tests/CONFIG_BASELINE.md)
  time_step:
    dt: @DT@   # PER-ARM: coarse 1 wk vs fine 0.25 wk
    error_tol: 0.1   # the resolved value; mode is fixed here so nothing steers on it
    mode: fixed
dev:
  storage_form: volume   # exact dV rather than the secant approximation
  under_relaxation: 1   # baseline (tests/CONFIG_BASELINE.md)
parallel:
  threads_per_rank: 1   # baseline (tests/CONFIG_BASELINE.md)
evaporation:
  et_sigmoid:
    wtd_center: 0.05   # UNSTATED: nobody chose this -- decide it for this suite
    logistic_width: 0.1   # UNSTATED: nobody chose this -- decide it for this suite
  extinction_depth: 8   # UNSTATED: nobody chose this -- decide it for this suite
  tapers:
    surface_transition: true   # SHIPPED-ON. With routing: off the taper is what removes surface water at all (evap_mode is gone, #88), so it is load-bearing here
    depth_extinction: true   # as above -- shipped taper configuration
io:
  source: '@INPUTS@'
  region: 'rech_test'
  time_start: 'ta'
  time_end: 'tb'
output:
  outfile_prefix: '@WORK@/@STEM@_'
  run_log: '@WORK@/@STEM@.txt'
  trace:
    dt: false
    water_step: false
    budget: false
    fsm: false
  verbosity: normal   # baseline (tests/CONFIG_BASELINE.md)
  directory: '@WORK@/@STEM@_prov'
  if_exists: overwrite

