# tests/boundary_analytic -- THE CONFIG THIS SUITE RUNS.
#
# A REAL FILE, not a generator's output (#83). Every setting the run resolves to is stated below.
#
# PROVENANCE: (none) = the suite chose it; # baseline = the model default owned once in
# tests/CONFIG_BASELINE.md; # <reason> = the model default, examined for THIS suite and owned here.
#
# WHAT THIS SUITE MEASURES: the boundary conditions against ANALYTIC solutions. The three arms differ
# in ONE key -- io.region -- because each names a different purpose-built fixture (Dirichlet, Neumann,
# sloped Neumann), and the boundary treatment follows from the fixture's own mask, not from a setting.
# That is why boundaries.land stays constant here while the arms vary.
#
# NOTE an OPEN DEFECT lives in this suite, not introduced by this file: task #34, the Neumann vertex
# assertion is defeated by nan. Materialising the config does not touch it.
#
# TOKENS substituted by run.sh: @INPUTS@, @WORK@, @STEM@, and @REGION@ for the per-arm fixture.

run:
  type: equilibrium
  equilibrium_stop:
    tol: 1e-8
    metric: rms
    frac: 0.001   # UNSTATED: nobody chose this -- decide it for this suite
  initial_water_table: saturated
time:
  total: "2419200000000s"
  report_interval: "50"
  save_every_n_reports: 20000
transmissivity:
  fdepth:
    a: 200
    b: 150
    fmin: 2
  additive_background_transmissivity: 0   # baseline (tests/CONFIG_BASELINE.md)
surface_water:
  routing: off
  runoff_ratio: 0
  infiltration_during_flow: false
  collection:
    method: off
boundaries:
  land: neumann_toposlope
solver:
  method: anderson
  time_integration: tr-bdf2   # what `anderson` resolves to; identical on every arm
  tolerance: 1e-8   # baseline (tests/CONFIG_BASELINE.md)
  max_iterations: 10000   # baseline (tests/CONFIG_BASELINE.md)
  t_bar: false   # off -- this suite does not exercise step-averaged transmissivity
  convergence:
    metric: volume   # the per-solve step judged in WATER (#61), the shipped default
    water_volume_tol: 1e-08   # the shipped per-solve water tolerance
  smoothing:
    ksat_surface: 0   # baseline (tests/CONFIG_BASELINE.md)
    ksat_soilbottom: 0   # baseline (tests/CONFIG_BASELINE.md)
    storativity_surface: 0.01   # baseline (tests/CONFIG_BASELINE.md)
  anderson:
    restart:
      enabled: false   # baseline (tests/CONFIG_BASELINE.md)
      rho: 0.9   # baseline (tests/CONFIG_BASELINE.md)
      patience: 2   # baseline (tests/CONFIG_BASELINE.md)
      max_it: 40   # baseline (tests/CONFIG_BASELINE.md)
      max_restarts: 30   # baseline (tests/CONFIG_BASELINE.md)
  time_step:
    mode: adaptive   # what the model resolves here; the same on every arm
    dt: 2419200
    error_tol: 1e-08   # the resolved target. TIGHT because this suite compares against ANALYTIC
                       # solutions, so the discretisation must not contribute to the error being judged
    grow: 1.5   # baseline (tests/CONFIG_BASELINE.md)
    shrink: 0.25   # baseline (tests/CONFIG_BASELINE.md)
    grow_if_niter_leq: 8   # baseline (tests/CONFIG_BASELINE.md)
    max_retries: 15   # baseline (tests/CONFIG_BASELINE.md)
    norm: rms   # baseline (tests/CONFIG_BASELINE.md)
dev:
  storage_form: volume   # exact dV rather than the secant approximation
  under_relaxation: 1   # baseline (tests/CONFIG_BASELINE.md)
parallel:
  threads_per_rank: 1   # baseline (tests/CONFIG_BASELINE.md)
evaporation:
  et_sigmoid:
    wtd_center: 0.05   # INERT here: both tapers are OFF (below), and these two parameterise the
    logistic_width: 0.1   # surface-transition taper -- nothing reads them when it is not applied
  extinction_depth: 8   # INERT here: it gates the depth_extinction taper, which is off
  tapers:
    surface_transition: false
    depth_extinction: false
io:
  source: '@INPUTS@'
  region: '@REGION@'   # PER-ARM: each arm names a different analytic fixture (anbcD Dirichlet,
                       # anbcN Neumann, anbcS sloped Neumann). The boundary treatment follows from
                       # the fixture's own mask, which is why boundaries.land is constant here.
  time_start: 'ta'
  time_end: 'tb'
output:
  outfile_prefix: '@WORK@/@STEM@_'
  run_log: '@WORK@/@STEM@.txt'
  trace: []
  verbosity: normal   # baseline (tests/CONFIG_BASELINE.md)
  directory: '@WORK@/@STEM@_prov'
  if_exists: overwrite

