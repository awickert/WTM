# tests/dt_sensitivity -- THE CONFIG THIS SUITE RUNS.
#
# A REAL FILE, not a generator's output (#83). Every setting the run resolves to is stated below.
#
# PROVENANCE: (none) = the suite chose it; # baseline = the model default owned once in
# tests/CONFIG_BASELINE.md; # <reason> = the model default, examined for THIS suite and owned here.
#
# WHAT THIS SUITE MEASURES: the equilibrium water table must NOT depend on the time step. It runs ONE
# problem at two time steps 4x apart, holding everything else fixed, and asserts the two agree under
# `active_set` -- while a CONTROL arm under `implicit` shows the same comparison IS dt-dependent, so
# the fixture is known to be able to detect the effect at all.
#
# THAT MAKES TWO KEYS THE SUBJECT, both per-arm in run.sh: solver.time_step.dt (the 4x) and
# surface_water.collection.method (active_set vs the implicit control).
#
# solver.time_step.mode: fixed IS LOAD-BEARING and is stated below rather than inherited. An adaptive
# controller would resize dt away from both starting values and erase the very separation under test,
# including the control arm that proves the test can detect dt-dependence at all.
#
# TOKENS substituted by run.sh: @INPUTS@, @WORK@, @STEM@.

run:
  type: equilibrium
  equilibrium_stop:
    tol: 0
    metric: frac   # INERT: equilibrium_stop.tol is 0, so nothing reads this
    frac: 0.001   # INERT: equilibrium_stop.tol is 0, so nothing reads this
  initial_water_table: supplied
time:
  total: "63072000000s"
  report_interval: "20"
  save_every_n_reports: @SAVE@   # PER-ARM: scales inversely with dt so both arms cover the SAME total
                                 # simulated time and write the same number of rasters
transmissivity:
  fdepth:
    a: 100
    b: 150
    fmin: 2
  additive_background_transmissivity: 0   # baseline (tests/CONFIG_BASELINE.md)
surface_water:
  coupling:
    iterations: 1   # the LAGGED coupling: a step uses the PREVIOUS step's FillSpillMerge
                    # output (#112). Declared because it is resolved for every run, and an
                    # absent key would leave this suite silent about which scheme it measures.
  routing: off
  runoff_ratio: 0
  collection:
    method: active_set   # THE SUBJECT (base arm). run.sh overrides to `implicit` for the CONTROL arms,
                         # whose retained head is ~linear in dt -- that is what makes the test bite.
  infiltration_during_flow: false
boundaries:
  land: neumann_toposlope
solver:
  method: anderson
  time_integration: tr-bdf2   # what `anderson` resolves to; identical on every arm
  tolerance: 1e-10
  max_iterations: 10000   # baseline (tests/CONFIG_BASELINE.md)
  t_bar: false   # off -- this suite does not exercise step-averaged transmissivity
  convergence:
    metric: volume   # the per-solve step judged in WATER (#61), the shipped default
    water_volume_tol: 1e-08   # the shipped per-solve water tolerance
    residual_gate: 1e-05   # baseline (tests/CONFIG_BASELINE.md). #104: the water-step verdict is
                           # REFUSED while the residual is above this x its initial value -- a
                           # relative step test cannot tell a converged solve from a stalled one.
  smoothing:
    ksat_surface: 0   # baseline (tests/CONFIG_BASELINE.md)
    ksat_soilbottom: 0   # baseline (tests/CONFIG_BASELINE.md)
    storativity_surface: 0.01   # baseline (tests/CONFIG_BASELINE.md)
  anderson:
    restart:
      enabled: false   # baseline (tests/CONFIG_BASELINE.md)
      rho: 0.9   # baseline (tests/CONFIG_BASELINE.md)
      patience: 2   # baseline (tests/CONFIG_BASELINE.md)
      max_it: 40   # baseline (tests/CONFIG_BASELINE.md)
      max_restarts: 30   # baseline (tests/CONFIG_BASELINE.md)
  time_step:
    mode: fixed
    dt: @DT@   # THE SUBJECT: run.sh supplies two values 4x apart. The equilibrium must not move.
    error_tol: 0.1   # the resolved value. INERT under mode: fixed -- nothing steers on it here
dev:
  storage_form: volume   # exact dV rather than the secant approximation
  under_relaxation: 1   # baseline (tests/CONFIG_BASELINE.md)
parallel:
  threads_per_rank: 1   # baseline (tests/CONFIG_BASELINE.md)
evaporation:
  et_sigmoid:
    wtd_center: 0.05   # UNSTATED: nobody chose this -- decide it for this suite
    logistic_width: 0.1   # UNSTATED: nobody chose this -- decide it for this suite
  extinction_depth: 8   # UNSTATED: nobody chose this -- decide it for this suite
  tapers:
    surface_transition: true   # SHIPPED-ON. With routing: off the taper is what removes surface water at all (evap_mode is gone, #88), so it is load-bearing here
    depth_extinction: true   # as above -- shipped taper configuration
io:
  source: '@INPUTS@'
  region: 'dtsens'
  time_start: 'ta'
  time_end: 'tb'
output:
  outfile_prefix: '@WORK@/@STEM@_'
  run_log: '@WORK@/@STEM@.txt'
  extra_rasters:            # additional rasters beside the water table. Same map shape as
                            # trace. The ordinary snapshot is the model's answer (an error
                            # against it is the WTM ERROR); post_groundwater is the solve's
                            # answer before FillSpillMerge (the POST-GROUNDWATER ERROR).
    post_groundwater: false
  trace:
    dt: false
    water_step: false
    budget: false
    fsm: false
  verbosity: normal   # baseline (tests/CONFIG_BASELINE.md)
  directory: '@WORK@/@STEM@_prov'
  if_exists: overwrite

