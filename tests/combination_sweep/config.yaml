# tests/combination_sweep -- THE CONFIG EVERY CELL OF THE SWEEP RUNS.
#
# A REAL FILE, not a generator's output (#83). Every setting the run resolves to is stated below, or
# is marked OPTIONAL with the reason (see the markers further down).
#
# PROVENANCE: (none) = the suite chose it; # baseline = the model default owned once in
# tests/CONFIG_BASELINE.md; # <reason> = the model default, examined for THIS suite and owned here.
#
# WHAT THIS SUITE MEASURES: which COMBINATIONS the model will run at all. 96 cells --
# 3 solvers x 4 integrator groups x 4 collectors x 2 run types -- each recorded as running, running
# only at dt/8, refused by design, or not converging. It is the evidence behind README's combination
# table, which is why a cell that fails for a HARNESS reason must never be filed as a design refusal.
#
# ONE FILE, SIX PER-CELL SLOTS. Unlike the other materialised suites this needs no split by step mode,
# because the step mode is not written here at all -- see the OPTIONAL note below.

# OPTIONAL: solver.time_step.mode -- resolved automatically; WHAT IT RESOLVES TO IS PART OF WHAT
# THIS SWEEP MEASURES.
# The mode follows from solver x integrator x collector (newton -> ramp; the implicit collector and
# backward-euler -> fixed; otherwise adaptive). Writing it per cell would mean encoding the model's own
# resolution rule in the test, and a test that re-derives the policy stops testing the model and starts
# testing its copy of it -- the mechanism behind several arms in #24. Expect: fixed | adaptive | ramp,
# per cell, and the model's own coverage fingerprint records which.
#
# OPTIONAL: surface_water.routing -- resolved automatically, same reason. An absent routing key resolves FROM THE
# COLLECTOR (measured: active_set -> continuous, explicit -> impulse, implicit -> continuous), and the
# collector is one of the axes being swept. Expect: continuous | impulse, per cell.
#
# AND THE CONTROLLER DIALS FOLLOW THE MODE, so they are optional for the same reason. WHICH DIALS
# EXIST AT ALL is decided by what solver.time_step.mode resolves to, and that parameter is OPTIONAL
# above -- so a cell cannot state its dials without first stating the mode, which is the thing being
# measured. Counted
# across the 86 runs of one sweep, the dependency is exact:
#     error_tol           86 cells -- every mode resolves one (0.5 adaptive, 0.1 fixed and ramp)
#     grow, shrink, grow_if_niter_leq, max_retries   66 -- the adaptive AND ramp cells
#     norm                42 -- the adaptive cells only
#     dt_max, newton.dt0  24 -- the ramp cells only, which is exactly the 24 newton cells
#
# OPTIONAL: solver.time_step.error_tol -- resolved in every mode; the value follows the mode
# OPTIONAL: solver.time_step.grow -- exists only under adaptive or ramp
# OPTIONAL: solver.time_step.shrink -- exists only under adaptive or ramp
# OPTIONAL: solver.time_step.grow_if_niter_leq -- exists only under adaptive or ramp
# OPTIONAL: solver.time_step.max_retries -- exists only under adaptive or ramp
# OPTIONAL: solver.time_step.norm -- exists only under adaptive
# OPTIONAL: solver.time_step.dt_max -- exists only under ramp, i.e. only on the newton cells
# OPTIONAL: solver.newton.dt0 -- exists only under ramp, i.e. only on the newton cells
#
# THE LIMIT THIS REACHES, stated plainly rather than hidden: ten optional parameters is a lot, and it
# is the honest cost of a suite whose SUBJECT is what the model resolves. Every one of them is a
# consequence of the two at the top. If this list ever grows to cover a key that is NOT downstream of
# the swept axes, that is a sign the marker is being used to quieten a real MISSING, and it should be
# challenged rather than extended.

run:
  type: @RUNTYPE@   # PER-CELL: equilibrium | transient
  equilibrium_stop:
    tol: 0
    metric: frac   # INERT: equilibrium_stop.tol is 0, so nothing reads this
    frac: 0.001   # INERT: equilibrium_stop.tol is 0, so nothing reads this
  initial_water_table: supplied
time:
  total: "4yr"
  report_interval: "2"
  save_every_n_reports: 9999
transmissivity:
  fdepth:
    a: 200
    b: 150
    fmin: 2
  additive_background_transmissivity: 0   # baseline (tests/CONFIG_BASELINE.md)
surface_water:
  runoff_ratio: 0
  infiltration_during_flow: false
  collection:
    method: @COLLECTOR@   # PER-CELL: active_set | explicit | implicit | off
boundaries:
  land: neumann_toposlope
solver:
  method: @METHOD@   # PER-CELL: anderson | picard | newton
  time_integration: @INTEG@   # PER-CELL: backward-euler | bdf2 | tr-bdf2
  tolerance: 1e-8
  max_iterations: 10000   # baseline (tests/CONFIG_BASELINE.md)
  t_bar: false   # off -- t_bar changes the operator, and this sweep varies the SCHEME around a fixed operator
  convergence:
    metric: volume   # the per-solve step judged in WATER (#61), the shipped default
    water_volume_tol: 1e-08   # the shipped per-solve water tolerance
    residual_gate: 1e-05   # baseline (tests/CONFIG_BASELINE.md). #104: the water-step verdict is
                           # REFUSED while the residual is above this x its initial value -- a
                           # relative step test cannot tell a converged solve from a stalled one.
  smoothing:
    ksat_surface: 0   # baseline (tests/CONFIG_BASELINE.md)
    ksat_soilbottom: 0   # baseline (tests/CONFIG_BASELINE.md)
    storativity_surface: 0.01   # baseline (tests/CONFIG_BASELINE.md)
  anderson:
    restart:
      enabled: false   # baseline (tests/CONFIG_BASELINE.md)
      rho: 0.9   # baseline (tests/CONFIG_BASELINE.md)
      patience: 2   # baseline (tests/CONFIG_BASELINE.md)
      max_it: 40   # baseline (tests/CONFIG_BASELINE.md)
      max_restarts: 30   # baseline (tests/CONFIG_BASELINE.md)
  time_step:
    dt: @DT@   # PER-CELL: the nominal step, or dt/8 on the retry pass
dev:
  storage_form: @STORAGE@   # PER-CELL: secant on the `be` group, volume on the other three.
                            # ALWAYS WRITTEN, NEVER OMITTED. The first attempt at this file used a
                            # deletable placeholder here; deleting the line let the model default
                            # (volume) apply, which silently turned all 24 `be` cells into `volume`
                            # cells. Every one then hit a refusal, and the suite reported ALL PASSED
                            # with `ran: 0` (#94). A slot substitutes a VALUE; it never removes a key.
  under_relaxation: 1   # baseline (tests/CONFIG_BASELINE.md)
parallel:
  threads_per_rank: 1   # baseline (tests/CONFIG_BASELINE.md)
evaporation:
  et_sigmoid:
    wtd_center: 0.05   # PARAMETERISES the surface-transition taper, on below
    logistic_width: 0.1   # PARAMETERISES the surface-transition taper, on below
  extinction_depth: 8   # gates the depth_extinction taper, on below
  tapers:
    surface_transition: true   # SHIPPED-ON. With routing on, this taper moves water across the surface, so it is inside every cell of the sweep
    depth_extinction: true   # SHIPPED-ON -- the shipped taper configuration
io:
  source: '@INPUTS@'
  region: 'rech_test'
  time_start: 'ta'
  time_end: '@TEND@'   # PER-CELL: follows run.type -- ta for equilibrium, tb for transient
output:
  outfile_prefix: '@WORK@/@STEM@_'
  run_log: '@WORK@/@STEM@.txt'
  trace:
    dt: false
    water_step: false
    budget: false
    fsm: false
  verbosity: normal   # baseline (tests/CONFIG_BASELINE.md)
  directory: '@WORK@/@STEM@_prov'
  if_exists: overwrite
