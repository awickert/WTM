# tests/combination_sweep -- THE CONFIG EVERY SWEEP CELL RUNS.
#
# A REAL FILE, not a generator's output (#83). What each cell STATES is stated below; what it
# RESOLVES to is the sweep's output, read from the model's own coverage fingerprint.
#
# WHAT THIS SUITE MEASURES, and why it is NOT on WTM_DECLARED_SUITES: it sweeps the (solver x
# integrator x step-mode x storage x collector x run-type) matrix and records which combinations RUN,
# which are REFUSED BY DESIGN, and which do not converge. Many cells abort deliberately. More to the
# point, several cells leave a key ABSENT ON PURPOSE and observe what the model resolves it to --
# active_set auto-enables volume storage, so a cell's requested and resolved integrator can differ,
# and that difference IS the measurement. Declaring those keys would delete the thing being observed.
# That is the same structural limit as tests/runoff_collector's `unset` arm, filed as #92.
#
# THE FOUR OPTIONAL AXES are placeholder lines (#@METHOD@ etc). A cell that names an axis has its line
# substituted; a cell that does not has the line DELETED, leaving the key genuinely absent rather than
# stated-at-its-default. Those are different inputs, and the difference is what this suite exists to see.
#
# TOKENS substituted by run.sh: @INPUTS@, @WORK@, @STEM@, @RUNTYPE@, @COLLECTOR@, @DT@, @TEND@,
# and the four optional placeholders.

run:
  type: @RUNTYPE@   # PER-CELL: equilibrium | transient
  equilibrium_stop:
    tol: 0
    metric: frac   # INERT: equilibrium_stop.tol is 0, so nothing reads this
    frac: 0.001   # INERT: equilibrium_stop.tol is 0, so nothing reads this
  initial_water_table: supplied
time:
  total: "4yr"
  report_interval: "2"
  save_every_n_reports: 9999
transmissivity:
  fdepth:
    a: 200
    b: 150
    fmin: 2
  additive_background_transmissivity: 0   # baseline (tests/CONFIG_BASELINE.md)
surface_water:
  routing: continuous   # FSM on for every cell; the sweep varies the SOLVER axes
  runoff_ratio: 0
  infiltration_during_flow: false
  collection:
    method: @COLLECTOR@   # PER-CELL
boundaries:
  land: neumann_toposlope
solver:
#@METHOD@
#@INTEG@
#@MODE@
  time_integration: backward-euler
  tolerance: 1e-8
  max_iterations: 10000   # baseline (tests/CONFIG_BASELINE.md)
  t_bar: false   # off -- this suite does not exercise step-averaged transmissivity
  convergence:
    metric: volume   # the per-solve step judged in WATER (#61), the shipped default
    water_volume_tol: 1e-08   # the shipped per-solve water tolerance
  smoothing:
    ksat_surface: 0   # baseline (tests/CONFIG_BASELINE.md)
    ksat_soilbottom: 0   # baseline (tests/CONFIG_BASELINE.md)
    storativity_surface: 0.01   # baseline (tests/CONFIG_BASELINE.md)
  anderson:
    restart:
      enabled: false   # baseline (tests/CONFIG_BASELINE.md)
      rho: 0.9   # baseline (tests/CONFIG_BASELINE.md)
      patience: 2   # baseline (tests/CONFIG_BASELINE.md)
      max_it: 40   # baseline (tests/CONFIG_BASELINE.md)
      max_restarts: 30   # baseline (tests/CONFIG_BASELINE.md)
  time_step:
    dt: @DT@   # PER-CELL
dev:
#@STORAGE@

  under_relaxation: 1   # baseline (tests/CONFIG_BASELINE.md)
parallel:
  threads_per_rank: 1   # baseline (tests/CONFIG_BASELINE.md)
evaporation:
  et_sigmoid:
    wtd_center: 0.05   # the SHIPPED ET sigmoid; evaporation is active here, so this shape is part of what is measured
    logistic_width: 0.1   # as above -- shipped ET sigmoid shape
  extinction_depth: 8   # shipped extinction depth
  tapers:
    surface_transition: true   # both tapers SHIPPED-ON; the result is obtained under the default taper configuration
    depth_extinction: true   # as above -- shipped taper configuration
io:
  source: '@INPUTS@'
  region: 'rech_test'
  time_start: 'ta'
  time_end: '@TEND@'   # PER-CELL: follows run.type
output:
  outfile_prefix: '@WORK@/@STEM@_'
  run_log: '@WORK@/@STEM@.txt'
  trace: []
  verbosity: normal   # baseline (tests/CONFIG_BASELINE.md)
  directory: '@WORK@/@STEM@_prov'
  if_exists: overwrite
