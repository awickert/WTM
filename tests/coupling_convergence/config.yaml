# tests/coupling_convergence -- THE CONFIG THIS SUITE RUNS.
#
# A REAL FILE, not a generator's output (#83). Every setting the run resolves to is stated below.
#
# PROVENANCE: (none) = the suite chose it; # baseline = the model default owned once in
# tests/CONFIG_BASELINE.md; # <reason> = the model default, examined for THIS suite and owned here.
#
# WHAT THIS SUITE MEASURES: `impulse` and `continuous` are two DISCRETISATIONS OF THE SAME PHYSICS --
# instantaneous routing -- so they must converge to the same answer as dt shrinks. Nothing asserted
# that before; it was assumed.
#
# FOUR AXES VARY PER ARM, and run.sh supplies all four:
#   surface_water.routing        impulse vs continuous -- THE SUBJECT
#   solver.time_step.dt          1 yr / 0.5 yr / 0.25 yr -- the refinement the order is measured over
#   time.report_interval         2 / 4 / 8, scaled INVERSELY with dt so every arm covers the same
#                                simulated time; otherwise the pairs would differ in length, not step
#   io.source + io.region        three fixtures (lake, multilake, cascade), because one was not enough:
#                                the original evidence came entirely from a filling depression, the
#                                most favourable case for the coupling.
#
# collection.method: active_set IS LOAD-BEARING, not a default taken idly. Under `explicit` every pair
# below would compare a run with ITSELF -- continuous yields to impulse there -- and the convergence
# orders would be measuring nothing.
#
# TOKENS substituted by run.sh: @INPUTS@, @WORK@, @STEM@, @ROUTING@, @DT@, @REPORT@, @REGION@.

run:
  type: equilibrium
  equilibrium_stop:
    tol: 0
    metric: frac   # INERT: equilibrium_stop.tol is 0, so nothing reads this
    frac: 0.001   # INERT: equilibrium_stop.tol is 0, so nothing reads this
  initial_water_table: supplied
time:
  report_interval: "@REPORT@"   # PER-ARM: 2/4/8, scaled inversely with dt so every arm covers
                                # the same simulated time -- otherwise pairs differ in LENGTH, not step
  total: "8yr"
  save_every_n_reports: 9999
transmissivity:
  fdepth:
    a: 200
    b: 150
    fmin: 2
  additive_background_transmissivity: 0   # baseline (tests/CONFIG_BASELINE.md)
surface_water:
  routing: @ROUTING@   # PER-ARM: THE SUBJECT -- impulse vs continuous
  collection:
    method: active_set   # LOAD-BEARING: under `explicit` continuous YIELDS to impulse, so every
                         # pair would compare a run with itself and the orders would measure nothing
  runoff_ratio: 0
  infiltration_during_flow: false
boundaries:
  land: neumann_toposlope
solver:
  method: anderson
  time_integration: tr-bdf2
  tolerance: 1e-10
  max_iterations: 10000   # baseline (tests/CONFIG_BASELINE.md)
  t_bar: false   # off -- this suite does not exercise step-averaged transmissivity
  convergence:
    metric: volume   # the per-solve step judged in WATER (#61), the shipped default
    water_volume_tol: 1e-08   # the shipped per-solve water tolerance
    residual_gate: 1e-05   # baseline (tests/CONFIG_BASELINE.md). #104: the water-step verdict is
                           # REFUSED while the residual is above this x its initial value -- a
                           # relative step test cannot tell a converged solve from a stalled one.
  smoothing:
    ksat_surface: 0   # baseline (tests/CONFIG_BASELINE.md)
    ksat_soilbottom: 0   # baseline (tests/CONFIG_BASELINE.md)
    storativity_surface: 0.01   # baseline (tests/CONFIG_BASELINE.md)
  anderson:
    restart:
      enabled: false   # baseline (tests/CONFIG_BASELINE.md)
      rho: 0.9   # baseline (tests/CONFIG_BASELINE.md)
      patience: 2   # baseline (tests/CONFIG_BASELINE.md)
      max_it: 40   # baseline (tests/CONFIG_BASELINE.md)
      max_restarts: 30   # baseline (tests/CONFIG_BASELINE.md)
  time_step:
    dt: @DT@   # PER-ARM: 1 yr / 0.5 yr / 0.25 yr -- the refinement the order is measured over
    error_tol: 0.1   # the resolved value; mode is fixed here so nothing steers on it
    mode: fixed
dev:
  storage_form: volume   # exact dV rather than the secant approximation
  under_relaxation: 1   # baseline (tests/CONFIG_BASELINE.md)
parallel:
  threads_per_rank: 1   # baseline (tests/CONFIG_BASELINE.md)
evaporation:
  et_sigmoid:
    wtd_center: 0.05   # the SHIPPED ET sigmoid; evaporation is active here, so this shape is part of what is measured
    logistic_width: 0.1   # as above -- shipped ET sigmoid shape
  extinction_depth: 8   # shipped extinction depth
  tapers:
    surface_transition: true   # both tapers SHIPPED-ON; the result is obtained under the default taper configuration
    depth_extinction: true   # as above -- shipped taper configuration
io:
  source: '@INPUTS@'
  region: '@REGION@'   # PER-ARM: fsm_test | multilake | fsm_cascade -- three fixtures, because
                       # the original evidence came only from a filling depression
  time_start: 't0'
  time_end: 't0'
output:
  outfile_prefix: '@WORK@/@STEM@_'
  run_log: '@WORK@/@STEM@.txt'
  extra_rasters:            # additional rasters beside the water table. Same map shape as
                            # trace. The ordinary snapshot is the model's answer (an error
                            # against it is the WTM ERROR); post_groundwater is the solve's
                            # answer before FillSpillMerge (the POST-GROUNDWATER ERROR).
    post_groundwater: false
  trace:
    dt: false
    water_step: false
    budget: false
    fsm: false
  verbosity: normal   # baseline (tests/CONFIG_BASELINE.md)
  directory: '@WORK@/@STEM@_prov'
  if_exists: overwrite

