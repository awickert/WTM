# tests/fsm_conservation -- THE CONFIG THIS SUITE RUNS.
#
# A REAL FILE, not a generator's output (#83). Every setting the run resolves to is stated below, which
# is what makes tests/config_identity.py's declared == resolved check meaningful here -- this is the
# suite the ratchet ENFORCES (tests/lib.sh WTM_DECLARED_SUITES).
#
# THE COMMENTS ARE THE PROVENANCE OF EACH VALUE, and there are three kinds:
#   (none)                        the suite chose it, deliberately, for what it measures
#   # baseline (CONFIG_BASELINE)  the model's default, taken on purpose, owned once for all suites
#   # <a reason>                  the model's default, examined FOR THIS SUITE and owned here
# A value with no provenance at all would be the laundering the config mirror was deleted for: a
# decision nobody made, wearing the clothes of one. There are none in this file.
#
# TOKENS substituted by run.sh: @INPUTS@ (fixture dir), @WORK@ (this run's work dir), @STEM@ (arm name).
#
# ARMS. The `c` arm runs as written -- routing: impulse. The `s` arm overrides that one key to
# `continuous`; comparing the two couplings is the whole subject, so the override lives in run.sh where
# that reasoning is.

run:
  type: equilibrium
  equilibrium_stop:
    tol: 0
    metric: frac   # INERT here: eq_tol 0 disables the equilibrium stop, so nothing reads this
    frac: 0.001   # INERT here: see metric above
  initial_water_table: supplied
time:
  total: "24yr"
  report_interval: "2"
  save_every_n_reports: 9999
transmissivity:
  fdepth:
    a: 200
    b: 150
    fmin: 2
  additive_background_transmissivity: 0   # baseline (tests/CONFIG_BASELINE.md)
surface_water:
  routing: impulse   # THE SUBJECT of the `c` arm. One key since 2026-09-10: `mode` and `fsm_coupling`
                     # merged into surface_water.routing, because with FSM off there is no coupling to
                     # name and the split let that contradiction be written down.
  runoff_ratio: 0
  infiltration_during_flow: false
  collection:
    method: active_set
boundaries:
  land: neumann_toposlope
solver:
  method: anderson
  time_integration: tr-bdf2
  tolerance: 1e-8   # baseline (tests/CONFIG_BASELINE.md)
  max_iterations: 10000   # baseline (tests/CONFIG_BASELINE.md)
  t_bar: false   # off. This suite does not test the step-averaged transmissivity
  convergence:
    metric: volume   # judged in WATER (#61) -- correct for a suite whose claim IS water conservation
    water_volume_tol: 1e-08   # the shipped per-solve water tolerance
  smoothing:
    ksat_surface: 0   # baseline (tests/CONFIG_BASELINE.md)
    ksat_soilbottom: 0   # baseline (tests/CONFIG_BASELINE.md)
    storativity_surface: 0.01   # baseline (tests/CONFIG_BASELINE.md)
  anderson:
    restart:
      enabled: false   # baseline (tests/CONFIG_BASELINE.md)
      rho: 0.9   # baseline (tests/CONFIG_BASELINE.md)
      patience: 2   # baseline (tests/CONFIG_BASELINE.md)
      max_it: 40   # baseline (tests/CONFIG_BASELINE.md)
      max_restarts: 30   # baseline (tests/CONFIG_BASELINE.md)
  time_step:
    mode: adaptive
    dt: 31536000
    error_tol: "0.5"
    grow: 1.5   # baseline (tests/CONFIG_BASELINE.md)
    shrink: 0.25   # baseline (tests/CONFIG_BASELINE.md)
    grow_if_niter_leq: 8   # baseline (tests/CONFIG_BASELINE.md)
    max_retries: 15   # baseline (tests/CONFIG_BASELINE.md)
    norm: rms   # baseline (tests/CONFIG_BASELINE.md)
dev:
  storage_form: volume   # exact dV, not the secant approximation -- the right form to assert conservation against
  under_relaxation: 1   # baseline (tests/CONFIG_BASELINE.md)
parallel:
  threads_per_rank: 1   # baseline (tests/CONFIG_BASELINE.md)
evaporation:
  et_sigmoid:
    wtd_center: 0.05   # the SHIPPED ET sigmoid. Evaporation is IN this suite's budget, so this
    logistic_width: 0.1   # shape is load-bearing: the conservation claim is made under it
  extinction_depth: 8   # shipped extinction depth; likewise part of the evap term being balanced
  tapers:
    surface_transition: true   # both tapers SHIPPED-ON. Conservation is asserted under the default taper
    depth_extinction: true   # configuration; a suite testing taper variants states them (tests/flicker_evap)
io:
  source: '@INPUTS@'
  region: 'fsm_test'
  time_start: 't0'
  time_end: 't0'
output:
  outfile_prefix: '@WORK@/@STEM@_'
  run_log: '@WORK@/@STEM@.txt'
  trace: []
  verbosity: normal   # baseline (tests/CONFIG_BASELINE.md)
  directory: '@WORK@/@STEM@_prov'
  if_exists: overwrite
