# tests/fsm_conservation -- THE CONFIG THIS SUITE RUNS.
#
# A REAL FILE, not a generator's output (#83). tests/emit_config.sh wrote the first version of it and is
# being retired; from here this file is edited directly. Every setting the run resolves to is stated
# below, which is what makes tests/config_identity.py's declared == resolved check meaningful for this
# suite -- it is the one the ratchet ENFORCES (tests/lib.sh WTM_DECLARED_SUITES).
#
# LINES MARKED `# UNSTATED` are values the generator supplied because the suite never named them. They
# are NOT decisions anyone made. They are written here so they can be READ and either owned or changed;
# leaving them unmarked would be exactly the laundering that the config mirror was deleted for.
# Removing a marker means someone decided that value is right for this suite.
#
# TOKENS substituted by run.sh: @INPUTS@ (fixture dir), @WORK@ (this run's work dir), @STEM@ (arm name).
#
# ARMS. The `c` arm runs as written -- fsm_coupling: impulse. The `s` arm overrides that one key to
# `continuous`; the whole point of the suite is comparing the two couplings, so the override is applied
# in run.sh where that reasoning lives, and nowhere else.

run:
  type: equilibrium
  equilibrium_stop:
    tol: 0
    metric: frac   # UNSTATED: shim default, nobody chose this
    frac: 0.001   # UNSTATED: shim default, nobody chose this
  initial_water_table: supplied
time:
  total: "24yr"
  report_interval: "2"
  save_every_n_reports: 9999
transmissivity:
  fdepth:
    a: 200
    b: 150
    fmin: 2
  additive_background_transmissivity: 0   # UNSTATED: shim default, nobody chose this
surface_water:
  mode: routed
  fsm_coupling: impulse
  runoff_ratio: 0
  infiltration_during_flow: false
  collection:
    method: active_set
boundaries:
  land: neumann_toposlope
solver:
  method: anderson
  time_integration: tr-bdf2
  tolerance: 1e-8   # UNSTATED: shim default, nobody chose this
  max_iterations: 10000   # UNSTATED: shim default, nobody chose this
  t_bar: false   # UNSTATED: shim default, nobody chose this
  convergence:
    metric: volume   # UNSTATED: shim default, nobody chose this
    water_volume_tol: 1e-08   # UNSTATED: shim default, nobody chose this
  smoothing:
    ksat_surface: 0   # UNSTATED: shim default, nobody chose this
    ksat_soilbottom: 0   # UNSTATED: shim default, nobody chose this
    storativity_surface: 0.01   # UNSTATED: shim default, nobody chose this
  anderson:
    restart:
      enabled: false   # UNSTATED: shim default, nobody chose this
      rho: 0.9   # UNSTATED: shim default, nobody chose this
      patience: 2   # UNSTATED: shim default, nobody chose this
      max_it: 40   # UNSTATED: shim default, nobody chose this
      max_restarts: 30   # UNSTATED: shim default, nobody chose this
  time_step:
    mode: adaptive
    dt: 31536000
    error_tol: "0.5"
    grow: 1.5   # UNSTATED: shim default, nobody chose this
    shrink: 0.25   # UNSTATED: shim default, nobody chose this
    grow_if_niter_leq: 8   # UNSTATED: shim default, nobody chose this
    max_retries: 15   # UNSTATED: shim default, nobody chose this
    norm: rms   # UNSTATED: shim default, nobody chose this
dev:
  storage_form: volume   # UNSTATED: shim default, nobody chose this
  under_relaxation: 1   # UNSTATED: shim default, nobody chose this
parallel:
  threads_per_rank: 1   # UNSTATED: shim default, nobody chose this
evaporation:
  et_sigmoid:
    wtd_center: 0.05   # UNSTATED: shim default, nobody chose this
    logistic_width: 0.1   # UNSTATED: shim default, nobody chose this
  extinction_depth: 8   # UNSTATED: shim default, nobody chose this
  tapers:
    surface_transition: true   # UNSTATED: shim default, nobody chose this
    depth_extinction: true   # UNSTATED: shim default, nobody chose this
io:
  source: '@INPUTS@'
  region: 'fsm_test'
  time_start: 't0'
  time_end: 't0'
output:
  outfile_prefix: '@WORK@/@STEM@_'
  run_log: '@WORK@/@STEM@.txt'
  trace: []
  verbosity: normal   # UNSTATED: shim default, nobody chose this
  directory: '@WORK@/@STEM@_prov'
  if_exists: overwrite
