run:
  type: equilibrium
  initial_water_table: saturated
time:
  deltat: 31536000
  total: 5yr
  report_interval: 1
  save_every_n_reports: 9999
# grid geometry (cells_per_degree=10, southern_edge=-45) is derived from the input geotransform (#124)
transmissivity:
  fdepth:
    a: 200
    b: 150
    fmin: 2
surface_water:
  mode: ponded
  infiltration_during_flow: false
io:
  source: inputs
  region: ghost_cell_test
  time_start: t0
  time_end: t0
output:
  outfile_prefix: out_
  run_log: run.txt
