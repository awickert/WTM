run:
  type: equilibrium
  initial_water_table: saturated
  equilibrium_stop:
    tol: 0            # run the full total_time; was the -wtm_eq_tol flag, retired to this key
time:
  total: 5yr
  report_interval: 1
  save_every_n_reports: 9999
# grid geometry (cells_per_degree=10, southern_edge=-45) is derived from the input geotransform (#124)
transmissivity:
  fdepth:
    a: 200
    b: 150
    fmin: 2
surface_water:
  coupling:
    iterations: 1   # the LAGGED coupling: a step uses the PREVIOUS step's FillSpillMerge
                    # output (#112). Declared because it is resolved for every run, and an
                    # absent key would leave this suite silent about which scheme it measures.
  routing: off   # FSM does not run. One key since 2026-09-10 (#89): with no routing there is
                 # no coupling, so `off` is the whole answer rather than a mode plus an unused coupling.
  infiltration_during_flow: false
io:
  source: inputs
  region: ghost_cell_test
  time_start: t0
  time_end: t0
output:
  outfile_prefix: out_
  run_log: run.txt
solver:
  # adaptive_dt is deliberately NOT pinned here: this fixture runs the SHIPPED DEFAULT, and
  # under it the n=1 and n=2 water tables agree at 0.000000 m. Pinning would have cost
  # coverage of the configuration users actually get, to buy nothing.
  time_step:
    dt: 31536000   # was time.deltat until 39fb4cd moved the step into solver:
