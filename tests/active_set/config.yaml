# tests/active_set -- THE CONFIG THIS SUITE RUNS.
#
# A REAL FILE, not a generator's output (#83). Every setting the run resolves to is stated below, which
# is what makes tests/config_identity.py's declared == resolved check meaningful here.
#
# PROVENANCE, three kinds:
#   (none)                        the suite chose it for what it measures
#   # baseline (CONFIG_BASELINE)  the model's default, taken on purpose, owned once for all suites
#   # <a reason>                  the model's default, examined FOR THIS SUITE and owned here
#
# WHAT THIS SUITE MEASURES: the active-set pin enforces the exfiltration complementarity INSIDE the
# matrix-free Anderson residual, against the FSM free surface. Because it SUPERSEDES the collector's
# own enforcement, the FSM-on equilibrium should come out the SAME whichever collector is named --
# that is the claim, and it is why collection.method is the per-arm override rather than a setting.
#
# WHAT THAT MAKES LOAD-BEARING: routing must be ON (the pin is defined against the FSM free surface,
# so with no lakes there is nothing to pin against), and the solver must be `anderson` (the pin lives
# in the matrix-free residual). Both are stated rather than inherited.
#
# TOKENS substituted by run.sh: @INPUTS@, @WORK@, @STEM@.

run:
  type: equilibrium
  equilibrium_stop:
    tol: 0
    metric: frac   # INERT: equilibrium_stop.tol is 0, so nothing reads this
    frac: 0.001   # INERT: equilibrium_stop.tol is 0, so nothing reads this
  initial_water_table: supplied
time:
  total: "6yr"
  report_interval: "2"
  save_every_n_reports: 9999
transmissivity:
  fdepth:
    a: 200
    b: 150
    fmin: 2
  additive_background_transmissivity: 0   # baseline (tests/CONFIG_BASELINE.md)
surface_water:
  routing: continuous   # FSM ON: the active-set pin is defined against the FSM FREE SURFACE
                        # (wtd <= d_pond), so with no lakes there is nothing for it to pin against.
  runoff_ratio: 0
  infiltration_during_flow: false
  collection:
    method: active_set   # THE SUBJECT, and the base arm. run.sh overrides this one key to `implicit`
                         # and `explicit`; the claim is that the FSM-on equilibrium is the SAME for
                         # all three, because the pin supersedes the collector's own enforcement.
boundaries:
  land: neumann_toposlope
solver:
  method: anderson   # the pin lives in the MATRIX-FREE residual, so this is a precondition
  time_integration: tr-bdf2   # what `anderson` resolves to; the same on every arm
  tolerance: 1e-8   # baseline (tests/CONFIG_BASELINE.md)
  max_iterations: 10000   # baseline (tests/CONFIG_BASELINE.md)
  t_bar: false   # off -- this suite does not exercise step-averaged transmissivity
  convergence:
    metric: volume   # the per-solve step judged in WATER (#61), the shipped default
    water_volume_tol: 1e-08   # the shipped per-solve water tolerance
    residual_gate: 1e-05   # baseline (tests/CONFIG_BASELINE.md). #104: the water-step verdict is
                           # REFUSED while the residual is above this x its initial value -- a
                           # relative step test cannot tell a converged solve from a stalled one.
  smoothing:
    ksat_surface: 0   # baseline (tests/CONFIG_BASELINE.md)
    ksat_soilbottom: 0   # baseline (tests/CONFIG_BASELINE.md)
    storativity_surface: 0.01   # baseline (tests/CONFIG_BASELINE.md)
  anderson:
    restart:
      enabled: false   # baseline (tests/CONFIG_BASELINE.md)
      rho: 0.9   # baseline (tests/CONFIG_BASELINE.md)
      patience: 2   # baseline (tests/CONFIG_BASELINE.md)
      max_it: 40   # baseline (tests/CONFIG_BASELINE.md)
      max_restarts: 30   # baseline (tests/CONFIG_BASELINE.md)
  time_step:
    mode: adaptive   # what the model resolves. Every arm shares it, so a collector comparison is
                     # not confounded by different step sequences
    dt: 31536000
    error_tol: 0.5   # the resolved adaptive target for this combination
    grow: 1.5   # baseline (tests/CONFIG_BASELINE.md)
    shrink: 0.25   # baseline (tests/CONFIG_BASELINE.md)
    grow_if_niter_leq: 8   # baseline (tests/CONFIG_BASELINE.md)
    max_retries: 15   # baseline (tests/CONFIG_BASELINE.md)
    norm: rms   # baseline (tests/CONFIG_BASELINE.md)
dev:
  storage_form: volume   # exact dV rather than the secant approximation
  under_relaxation: 1   # baseline (tests/CONFIG_BASELINE.md)
parallel:
  threads_per_rank: 1   # baseline (tests/CONFIG_BASELINE.md)
evaporation:
  et_sigmoid:
    wtd_center: 0.05   # the SHIPPED ET sigmoid; evaporation is active here, so this shape is part of what is measured
    logistic_width: 0.1   # as above -- shipped ET sigmoid shape
  extinction_depth: 8   # shipped extinction depth
  tapers:
    surface_transition: true   # both tapers SHIPPED-ON; the result is obtained under the default taper configuration
    depth_extinction: true   # as above -- shipped taper configuration
io:
  source: '@INPUTS@'
  region: 'fsm_test'
  time_start: 't0'
  time_end: 't0'
output:
  outfile_prefix: '@WORK@/@STEM@_'
  run_log: '@WORK@/@STEM@.txt'
  trace: []
  verbosity: normal   # baseline (tests/CONFIG_BASELINE.md)
  directory: '@WORK@/@STEM@_prov'
  if_exists: overwrite

