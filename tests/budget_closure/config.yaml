# tests/budget_closure -- THE CONFIG THE ADAPTIVE ARMS RUN.
#
# A REAL FILE, not a generator's output (#83). Every setting the run resolves to is stated below.
#
# PROVENANCE: (none) = the suite chose it; # baseline = the model default owned once in
# tests/CONFIG_BASELINE.md; # <reason> = the model default, examined for THIS suite and owned here.
#
# WHAT THIS SUITE MEASURES: that the EXACT WATER BUDGET closes, to TOL relative to the run's own solver
# recharge, across every combination of solver, integrator, storage form, coupling and collector the
# model offers. It is the suite that turns "the model conserves water" into an assertion, so its arms
# deliberately span the matrix rather than picking one representative point.
#
# THREE FILES, ONE PER RESOLVED STEP MODE, because the three resolve DIFFERENT KEY SETS and a config
# must state what its run resolves to rather than a superset:
#     config.yaml         mode: adaptive  -- 11 arms; carries error_tol and the grow/shrink/norm dials
#     config_fixed.yaml   mode: fixed     --  6 arms; no controller dials at all
#     config_ramp.yaml    mode: ramp      --  2 arms; the newton arms, which carry solver.newton.dt0
#
# WHICH MODE AN ARM GETS IS NOT A FREE CHOICE. It follows from the solver, the integrator AND the
# collector -- measured across all 19 arms, not assumed:
#     solver.method: newton              -> ramp
#     collection.method: implicit        -> fixed
#     time_integration: backward-euler   -> fixed
#     otherwise (tr-bdf2, or bdf2 asked adaptive explicitly) -> adaptive
# That is why arms which look alike in run.sh land in different files here.
#
# ELEVEN ARMS run from this file:
#   a_as  c_as  d_and  tr_as  tr_as_ad   anderson x tr-bdf2 x active_set
#   c_ex                                 anderson x tr-bdf2 x explicit   (routing resolves to impulse)
#   c_off                                anderson x tr-bdf2 x off
#   bdf2v_ad                             anderson x bdf2, asked adaptive explicitly
#   c_pex  d_pic                         picard  x bdf2 x explicit
#
# a_as, c_as and d_and resolve to the SAME config. For d_and that is the point -- its subject is the
# ABSENT collector key, and equalling c_as IS the assertion. For a_as vs c_as it is not obviously
# deliberate: they differ only in the tolerance their assertions use. Task #98 carries that.
run:
  type: equilibrium
  equilibrium_stop:
    tol: 0
    metric: frac   # INERT: equilibrium_stop.tol is 0, so nothing reads this
    frac: 0.001   # INERT: equilibrium_stop.tol is 0, so nothing reads this
  initial_water_table: supplied
time:
  total: "20yr"
  report_interval: "1"
  save_every_n_reports: 9999
transmissivity:
  fdepth:
    a: 200
    b: 150
    fmin: 2
  additive_background_transmissivity: 0   # baseline (tests/CONFIG_BASELINE.md)
surface_water:
  coupling:
    iterations: @ITERS@   # PER-ARM, and it FOLLOWS the routing above: the shipped default 4
                    # where routing is continuous, else 1 (the model refuses an explicit >1 where
                    # there is no lagged source to iterate against).  Emitted by coupling_iters_for
                    # in lib.sh; see tests/COUPLING_COVERAGE.md for the rule and the classification.
  routing: @ROUTING@   # PER-ARM, and it RESOLVES from the collector rather than being free:
                       # `explicit` cannot take the continuous coupling, so those arms get impulse
  runoff_ratio: 0.3
  infiltration_during_flow: false
@COLLECTION@
boundaries:
  land: neumann_toposlope
solver:
  method: @METHOD@   # PER-ARM: anderson | picard
  time_integration: @INTEG@   # PER-ARM: tr-bdf2 | bdf2
  tolerance: @STOL@   # PER-ARM: 1e-8 everywhere but d_ntu, whose Newton comparison
                      # needs 1e-10 to separate the answer from the solve
  max_iterations: 10000   # baseline (tests/CONFIG_BASELINE.md)
  t_bar: false   # off -- step-averaged transmissivity would change the operator whose budget is being closed
  convergence:
    metric: volume   # the per-solve step judged in WATER (#61). LOAD-BEARING: this suite closes a WATER budget, so the solve must converge in the same currency
    water_volume_tol: 1e-08   # the shipped per-solve water tolerance
    residual_gate: 1e-05   # baseline (tests/CONFIG_BASELINE.md). #104: the water-step verdict is
                           # REFUSED while the residual is above this x its initial value -- a
                           # relative step test cannot tell a converged solve from a stalled one.
  smoothing:
    ksat_surface: 0   # baseline (tests/CONFIG_BASELINE.md)
    ksat_soilbottom: 0   # baseline (tests/CONFIG_BASELINE.md)
    storativity_surface: 0.01   # baseline (tests/CONFIG_BASELINE.md)
  anderson:
    restart:
      enabled: false   # baseline (tests/CONFIG_BASELINE.md)
      rho: 0.9   # baseline (tests/CONFIG_BASELINE.md)
      patience: 2   # baseline (tests/CONFIG_BASELINE.md)
      max_it: 40   # baseline (tests/CONFIG_BASELINE.md)
      max_restarts: 30   # baseline (tests/CONFIG_BASELINE.md)
  time_step:
    mode: adaptive   # resolved, not asked for: tr-bdf2 (and bdf2 asked adaptive) get the controller
    dt: 31536000
    dt_min: "315.36s"   # controller floor, required on an explicit mode: adaptive (#109). 1e-5 x dt is
                        # WTM's own scale-free choice, and what the removed default computed. NOT
                        # MODFLOW's recommendation, whose 1e-5 is an ABSOLUTE length in model time
                        # units, recommended for reporting alignment rather than accuracy. MODFLOW
                        # and ParFlow are the precedent for REQUIRING a floor, not for its value.
                        # See benchmark/BDF2_ADAPTIVE_DESIGN.md.
    error_tol: @DT_TOL@   # PER-ARM: 0.5 is the resolved default; tr_as_ad pins 0.01 so the controller
                          # actually SUBDIVIDES instead of accepting every step (#20)
    grow: 1.5   # baseline (tests/CONFIG_BASELINE.md)
    shrink: 0.25   # baseline (tests/CONFIG_BASELINE.md)
    grow_if_niter_leq: 8   # baseline (tests/CONFIG_BASELINE.md)
    max_retries: 15   # baseline (tests/CONFIG_BASELINE.md)
    norm: rms   # baseline (tests/CONFIG_BASELINE.md)
dev:
  storage_form: volume   # exact dV rather than the secant approximation
  under_relaxation: 1   # baseline (tests/CONFIG_BASELINE.md)
parallel:
  threads_per_rank: 1   # baseline (tests/CONFIG_BASELINE.md)
evaporation:
  et_sigmoid:
    wtd_center: 0.05   # PARAMETERISES the surface-transition taper, on below
    logistic_width: 0.1   # PARAMETERISES the surface-transition taper, on below
  extinction_depth: 8   # gates the depth_extinction taper, on below
  tapers:
    surface_transition: true   # SHIPPED-ON. With routing on, this taper moves water across the surface, so it is inside the budget being closed
    depth_extinction: true   # SHIPPED-ON -- the shipped taper configuration
io:
  source: '@INPUTS@'
  region: 'fsm_test'
  time_start: 't0'
  time_end: 't0'
output:
  outfile_prefix: '@WORK@/@STEM@_'
  run_log: '@WORK@/@STEM@.txt'
  extra_rasters:            # additional rasters beside the water table. Same map shape as
                            # trace. The ordinary snapshot is the model's answer (an error
                            # against it is the WTM ERROR); post_groundwater is the solve's
                            # answer before FillSpillMerge (the POST-GROUNDWATER ERROR).
    post_groundwater: false
  trace:
    dt: false
    water_step: false
    budget: false
    fsm: false
  verbosity: normal   # baseline (tests/CONFIG_BASELINE.md)
  directory: '@WORK@/@STEM@_prov'
  if_exists: overwrite
