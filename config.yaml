##################################################
## CONFIGURATION OF THE WATER TABLE MODEL (WTM) ##
##################################################
#
# Nested YAML: sections group related settings. Booleans are true/false. Times take an explicit unit
# ("500yr" / "1000s"); a bare number is read as years (with a warning). Solver / numerics are config keys now
# (they map to the -wtm_* / -snes_* flags underneath); an explicit CLI flag still overrides the config.

run:
  type: equilibrium            # test | equilibrium | transient
  initial_water_table: saturated   # saturated (wtd = 0) | supplied (read the starting_wt input layer) | <path to a raster>
  equilibrium_stop:            # end an equilibrium run early once the water table has settled
    tol: 0.001                 #   HOW STILL IS STILL ENOUGH. The run ends when a whole cycle moves less
                               #   water than this. 0 = never stop early; run the clock out.
                               #   Metres of WATER, not of water table: |S*Δwtd|, the water that actually
                               #   shifted. At porosity 0.25 this 1 mm of water is 4 mm of table movement.
                               #   This is the one threshold here that is a MODELLING judgement rather than
                               #   a numerical one -- what counts as negligible for your question -- which
                               #   is why nothing derives it. The two below derive from it.
    metric: frac               #   how the change is judged (all water-based): max | rms | frac
    frac: 0.001                #   for metric: frac -- fraction of cells still above tol (0.001 = 0.1%)

time:
  total: 1000yr                # total simulated time (an integer number of report intervals)
  report_interval: 100         # steps between equilibrium checks / log lines (or a time, e.g. "50yr")
  save_every_n_reports: 1      # write a water-table raster every N reports

# grid is DEPRECATED: geometry is derived from the input GDAL geotransform. Override only for ungeoreferenced
# inputs:
# grid:
#   cells_per_degree: 120
#   southern_edge: -52

io:
  source: surfdata/            # a folder of GeoTIFFs (Callaghan convention) OR a single .nc file
  region: Australia_           # filename/variable prefix (include any trailing separator; may be blank)
  time_start: "021000"         # quote to preserve leading zeros
  time_end: "021000"           # differs from time_start for transient runs

output:
  directory: results/          # parent dir; each run writes to results/run<NNN>_<timestamp>/ (never clobbered)
  outfile_prefix: wtd_         # water-table raster prefix within the run subdir
  run_log: run.log             # per-run status log within the run subdir
  verbosity: normal            # quiet | normal | verbose
  if_exists: increment         # increment (new subdir each run) | overwrite | error
  trace:                       # extra machine-readable DIAGNOSTIC lines on stdout, for tests and for
                               # debugging. ANSWER-NEUTRAL: turning these on only prints, it never
                               # changes what the model computes. A MAP rather than a list, so the
                               # channels are discoverable here instead of having to be known.
    dt: false                  # DTTRACE after every step: dt, the error estimate, the tolerance, the
                               # factor, iterations, accepted. REJECTED steps included -- they are where
                               # a mis-scaled estimate does its damage, and omitting them hides it.
    fsm: false                 # FSMTRACE after every FillSpillMerge call, rank 0: wet_cells,
                               # lake_volume, max_depth. The lake configuration is what changes
                               # DISCRETELY between runs, so this is the first thing to compare when two
                               # runs differ and the cause is not obvious -- e.g. when refining the time
                               # step makes the answer WORSE, which it can (BDF2_ADAPTIVE_DESIGN.md 3.5).
    budget: false              # BUDGETTRACE: the per-step water-budget terms.
    water_step: false          # per-ITERATION line: the head step, an independent reconstruction of it,
                               # and the same step measured in WATER. Denser than dt, which is per-step.

  extra_rasters:               # additional rasters written beside the water table. Same map shape as
                               # trace, and for the same reason. All default false.
    post_groundwater: false    # the table AFTER the groundwater solve and BEFORE FillSpillMerge, as
                               # <outfile_prefix>postgw_<n>_<T>yr.tif, matched step-for-step with the
                               # ordinary snapshot beside it. THE TWO ANSWER DIFFERENT QUESTIONS, and
                               # mixing them is how a comparison invents a difference that is not there:
                               #   ordinary snapshot -> the model's answer  -> "WTM error"
                               #   this one          -> the solve's answer  -> "post-groundwater error"
                               # Turn it on to separate solve error from routing error. Off by default
                               # because it doubles raster volume.

boundaries:
  land: neumann_toposlope      # neumann_toposlope (terrain-following no-flow) | dirichlet_sea_level
                               # (ocean cells are always Dirichlet h = 0 -- not configurable)

transmissivity:
  fdepth:                      # e-folding-depth parameters (Fan/Ying)
    a: 200
    b: 150
    fmin: 2
  additive_background_transmissivity: 0   # background (bedrock) T added everywhere [m^2/s]; 0 = off

evaporation:
  et_sigmoid:                  # the continuous soil<->open-water ET transition
    wtd_center: 0.05
    logistic_width: 0.1
  extinction_depth: 8          # depth below which ET can no longer reach the water table [m]
  tapers:                      # the two surface-transition tapers, BOTH default true. They are
                               # SWITCHES; the values they use are the keys above (et_sigmoid.* for
                               # the first, extinction_depth for the second). Turning either off is a
                               # DIAGNOSTIC choice -- the model is stiffest exactly where they smooth,
                               # and with both off a free-surface run can fail to find a usable step.
    surface_transition: true   # blend phreatic ET to open-water ET across wtd = 0, instead of
                               # switching hard at the surface.
    depth_extinction: true     # no phreatic ET below evaporation.extinction_depth: roots and
                               # capillarity cannot reach the table there, so an arid cell stops
                               # drawing down instead of running away.

surface_water:
  routing: continuous          # continuous | impulse | off -- ONE key for what happens to above-ground water:
                               # whether FillSpillMerge routes it, and when it does, how FSM's result reaches
                               # the groundwater.
                               # continuous: the table is left alone and FSM's per-cell VOLUME CHANGE is fed
                               #             into the next step's recharge source, so the solver never sees a
                               #             between-step jump in its state. The DEFAULT.
                               # impulse:    FSM's post-routing water table REPLACES the step baseline.
                               #             What the model has always done, and what v2.0.1 does.
                               # off:        FillSpillMerge does not run; above-ground water is not routed.
                               #             `off` is a REAL STATE, not an absence -- with no routing there is
                               #             no coupling, so a run records `off` rather than naming a
                               #             mechanism it never used.
                               # THE REASON IS PHYSICAL. FSM is instantaneous by construction, so under
                               # `impulse` the state always carries a FULLY EQUILIBRATED lake -- a depression
                               # is full from the instant there is water to fill it, and evaporates at the
                               # open-water rate for the whole step. Real water flows in over the interval and
                               # evaporates as it arrives. Refining dt does not soften that; it just
                               # re-equilibrates more often.
                               # The two are discretisations of the SAME physics -- they converge as dt -> 0,
                               # first order (tests/coupling_convergence) -- and measured accuracy at usable
                               # dt is a wash, each closer on two of four budget columns. So this is chosen on
                               # the physics, not on numerics.
                               # COSTS, stated plainly: `continuous` works only with collection.method:
                               # active_set. It is REFUSED with explicit, and its budget does not close with
                               # implicit. Its budget is also not invariant to the solve count -- same water,
                               # different partition -- which is real and is the physics, not an error.
                               # CHANGES THE ANSWER.
                               # THIS KEY REPLACED `mode` AND `fsm_coupling` (2026-09-10). They were two keys
                               # answering one question, and the split let you write a contradiction:
                               # `mode: ponded` with `fsm_coupling: continuous` asked for a coupling that
                               # cannot happen. An old config is refused by name, with the translation.
                               # (`mode: ponded` and `mode: removed` both become `off`: they were already
                               # indistinguishable -- the default taper never consults the old evap_mode.)
  coupling:
    iterations: 1              # how many times a step solves against its OWN FillSpillMerge output (#112).
                               # THE LAG THIS ADDRESSES. Under routing: continuous, FSM's per-cell volume
                               # change is fed into the NEXT step's recharge source, so a step never sees
                               # its own runoff -- the coupling is lagged by one step. Iterating removes the
                               # lag: snapshot the state, solve, run FSM, roll back everything EXCEPT FSM's
                               # volume change, and solve the SAME step again with that as its source.
                               #   1  the lagged scheme. Today's model, and every result published from it.
                               #   k  k solve+FSM passes per step; the last one is the answer.
                               # There is no 0 -- a step that never solves is not a mode, and it is refused.
                               # NEEDS routing: continuous, and is REFUSED otherwise by name. Under `impulse`
                               # FSM overwrites the water table in place and under `off` it does not run, so
                               # there is no lagged source to iterate against.
                               # COST: each pass is a FULL GROUNDWATER RE-SOLVE, not an extra FSM call. FSM
                               # itself is 0.142% of a cycle at 384,703 cells (benchmark/esquibel/FSM_COST.md);
                               # the solve is ~99.7%. So k passes cost about k times the step.
                               # CHANGES THE ANSWER during transients -- which is the point, since a spin-up
                               # is all transient. At EQUILIBRIUM it changes nothing by construction: there
                               # w_{n+1} = w_n, so FSM(w_n) and FSM(w_{n+1}) are the same array and the lag is
                               # identically zero. Measured on tests/fsm_cascade: iterations 1, 2 and 3 give a
                               # BIT-IDENTICAL final water table (max|dwtd| = 0.000e+00 m over 900 cells) by
                               # three different paths -- 70, 184 and 212 solver calls over 4, 15 and 7 steps.
                               # See benchmark/FSM_COUPLING_ITERATION.md for the design and its amendments.
  # runoff_ratio: 0.0          # a number in [0,1] (uniform), the string "raster" (require the raster), or omit (off)
  infiltration_during_flow: false
  collection:
    # How the wtd <= surface constraint is ENFORCED. active_set is the DEFAULT and the recommended
    # choice: it is the only enforcement measured to leave no spurious dt-dependence (implicit's
    # in-residual siphon removes at rate max(0,wtd)/dt, so its retained head is ~linear in dt and FSM
    # routes that dt-dependent excess into a different set of lakes -- the lake COUNT moves with dt).
    #   active_set  in-residual semismooth pin (DEFAULT; Anderson/Newton -- Picard falls back to explicit)
    #   explicit    post-solve clamp; robust on every solver, dt-lagged
    #   implicit    in-residual siphon; the FORMER default, dt-dependent -- prefer active_set
    #   off         no collection; above-surface water piles up. NONPHYSICAL, warns
    #   extended_soil  aquifer continues above the surface. NONPHYSICAL, [WIP], diagnostics only
    method: active_set

# DEFAULTS ARE SOLVER-DEPENDENT, AND THAT IS DELIBERATE (Andy, 2026-09-10). An omitted key always
# means "the default" -- it never means a third thing -- but WHICH default applies depends on the
# solver you chose, because the solvers do not support the same machinery. Choosing `method` therefore
# selects a whole default SET:
#
#     key                              anderson        picard          newton
#     ------------------------------   -------------   -------------   --------------
#     solver.time_integration          tr-bdf2         backward-euler  backward-euler
#     solver.time_step.mode            adaptive        adaptive        ramp
#     surface_water.collection.method  active_set      explicit        active_set
#
# One of these also depends on the COLLECTOR rather than the solver: with
# collection.method: implicit the step mode defaults to `fixed`, because an error controller cannot
# drive that enforcement -- its per-step error GROWS as dt shrinks.
#
# Every one of these is ANNOUNCED at runtime and RECORDED in full_config.yaml, so a run always says
# which default set it used. Setting a key explicitly always wins, and where a combination cannot
# work the model refuses BY NAME rather than quietly substituting (see collection.method: active_set
# on Picard, and routing: continuous with collection.method: explicit).

# WHAT COMBINATIONS ACTUALLY RUN -- collector x routing x step mode, on Anderson with FSM on.
# Twelve combinations; FOUR are refused. Derived from the refusal code (parameters.cpp and
# resolve_defaults.cpp), and exercised by tests/combination_sweep, which requires every combination to
# either RUN or REFUSE with a legible message.
#
#   collector    routing     mode       runs?          why not, or what to watch
#   -----------  ----------  ---------  -------------  ------------------------------------------------
#   active_set   continuous  adaptive   yes            THE PRODUCTION DEFAULT
#   active_set   continuous  fixed      yes
#   active_set   impulse     adaptive   yes
#   active_set   impulse     fixed      yes
#   explicit     impulse     fixed      yes
#   explicit     impulse     adaptive   yes, WARNED    the post-solve clamp lets the clamped set change
#                                                      between steps -> free-surface oscillation. Stated
#                                                      rather than fixed: explicit is not production.
#   implicit     impulse     fixed      yes
#   implicit     continuous  fixed      yes, UNSOUND   it runs, but the budget does NOT close under
#                                                      implicit -- do not build a conservation claim on it
#   explicit     continuous  adaptive   NO             continuous feeds above-surface water back as a
#   explicit     continuous  fixed      NO             SOURCE while explicit clamps it AFTER the solve.
#                                                      They fight: observed order goes NEGATIVE under dt
#                                                      refinement and the error stalls at ~1.1 m.
#   implicit     continuous  adaptive   NO             the implicit siphon removes at rate max(0,wtd)/dt,
#   implicit     impulse     adaptive   NO             so per-step error GROWS as the controller shrinks
#                                                      dt. Error control's founding assumption is false
#                                                      for it; no step is ever accepted and the run dies
#                                                      on max retries.
#
# THE TWO REFUSALS BITE ON DIFFERENT AXES, which is the useful structure here: `explicit` is refused
# only against `continuous`, `implicit` only against `adaptive`. So `impulse` + `fixed` is the ONE
# combination of routing and step mode under which ALL THREE collectors run -- the only way to vary the
# collector alone, with everything else held. tests/active_set uses exactly that for its comparison
# arms, and keeps a separate arm on the production default so both properties stay covered (#90).

solver:
  method: anderson             # anderson (matrix-free; default) | picard | newton
                               # CHOOSING THIS ALSO CHOOSES A DEFAULT SET -- see the table above.
                               # newton means the WORKING recipe: the analytic-Jacobian path WITH
                               # dt-continuation, which it needs to converge from a cold start.
  tolerance: 1e-6              # per-solve step tolerance (-> snes_stol). RELATIVE and in HEAD: stop the
                               # solve when ||Δh|| falls below this fraction of ||h||.
                               # ONLY LIVE WHEN convergence.metric: head. The default metric is `water`
                               # (see below), which uses water_volume_tol instead; this then survives
                               # only as PETSc's own backstop and as the adaptive-restart phase bound.
                               # Innermost of the three gates: solve ⊂ step ⊂ run. Set it LOOSER than the
                               # step target and the step's error estimate is measuring solver noise.
  convergence:
    metric: volume             # volume (DEFAULT) | head -- what the PER-SOLVE step test judges.
                               # `volume` judges the step as |S*Δwtd| -- WATER VOLUME, per unit area, so it
                               # is a depth in metres and not m^3 -- and then all three "close enough" gates
                               # speak one language (this, run.equilibrium_stop and
                               # solver.time_step.error_tol); `head` is the off-switch and leaves this
                               # one gate out of step with the other two. CHANGES THE ANSWER.
                               # It matters where storativity is small: a deep tight cell can swing its
                               # head a long way while moving almost no water, and a head-judged test
                               # lets those few cells speak for the whole grid.
                               # WHY IT IS THE DEFAULT (#61): a head step tolerance is a LENGTH and the
                               # water budget it must agree with is a VOLUME. Measured over 294 solves,
                               # 88% were exiting on the head step test having reduced the residual by
                               # as little as 1.8e-04 -- and the exact budget then reports the un-driven
                               # residual as REAL unbalanced mass (worst step 9.4e-05 of recharge). In
                               # water the same runs close to 3.9e-07..1.9e-06, for about +2% wall.
    water_volume_tol: 1.0e-8   # the SAME gate as solver.tolerance above, in water instead of head.
                               # Exactly one of the two is live, chosen by metric -- and since `water`
                               # is the default, THIS is normally the live one. It sits here rather than
                               # beside tolerance because it is only meaningful with the metric that
                               # selects it.
                               # RELATIVE, like tolerance: a fraction of the water already in the domain,
                               # not a depth. Loosening it does NOT save time -- each solve stops
                               # under-converged and the outer loop needs more cycles (measured: 1e-5
                               # costs 3x the solves of 1e-8 on tests/solver_consistency).
# max_iterations:              # per-solve cap (-> snes_max_it). OMIT for PETSc's per-method default.
  time_integration: tr-bdf2    # backward-euler | bdf2 | tr-bdf2. OMIT to resolve PER METHOD:
                               # anderson -> tr-bdf2, picard/newton -> backward-euler. The run prints
                               # what it chose, and full_config.yaml records it. tr-bdf2 runs
                               # only on the Anderson path, so a constant tr-bdf2 default would make a
                               # config naming only `method: picard` abort on a key it never set.
  t_bar: false                 # time-/log-averaged transmissivity over the step (cures cold Picard)

  time_step:                   # the time step, WHO SIZES IT, and the dials that adjust it.
    mode: adaptive             # fixed | adaptive | ramp -- one key, because these are three answers to
                               # ONE question: who chooses the step. OMIT to resolve: `ramp` under
                               # method: newton (which needs it to converge from cold), `fixed` under
                               # collection.method: implicit (an error controller cannot drive it --
                               # its per-step error GROWS as dt shrinks), `adaptive` otherwise. The run
                               # prints what it chose and full_config.yaml records it.
                               #   adaptive  error-controlled, clamped to the report span. It gets
                               #             through runs a fixed step cannot -- it shrinks where the
                               #             problem is hard and grows where it is easy, so a stiff
                               #             stretch that would stall or abort at a constant dt is
                               #             survivable. That is what it is FOR, and it is the reason
                               #             to reach for it.
                               #             MEASURED 2026-09-17 on real terrain (Corsica, 30", DEM
                               #             slope so fdepth spans 2-200 m), Anderson, serial, walking
                               #             the step up in powers of two: at 512 weeks and at 1024
                               #             weeks `fixed` DIES ("The SNES solver has not converged";
                               #             "TR-BDF2 trapezoidal stage (1) did not converge") while
                               #             `adaptive`, handed the same step as a STARTING point,
                               #             subdivides and finishes. Reproduce with
                               #             examples/island_equilibrium/demo.py corsica
                               #             --solver anderson --mode fixed|adaptive --dt-weeks 512.
                               #             COSTS, so the choice is informed: an adaptive run is NOT
                               #             REPRODUCIBLE ACROSS RANK COUNTS on a long run. The error
                               #             estimate is a global reduction, so its last bits depend on
                               #             how many ranks summed it; over ~100 steps that difference
                               #             compounds until two rank counts take DIFFERENT NUMBERS OF
                               #             STEPS (measured: 108 at n=1 vs 104 at n=4 on corsica) and
                               #             from there the answers differ by truncation error rather
                               #             than by rounding -- 1.3e-03 m at a 1 yr step, 1.0e-01 m at
                               #             48 weeks. Both runs are equally valid and they agree on
                               #             the physics (same lakes, same maximum depth); they are not
                               #             the same arithmetic. This is NOT the #56 defect, which was
                               #             a decomposition-dependent estimator DIVISOR and is fixed
                               #             (tests/xrank_adaptive still pins it: identical step counts
                               #             and sequences to ~1e-09 on its fixture). If you need the
                               #             same answer on any core count, use `fixed`.
                               #   ramp      pseudo-transient continuation: grows on solve-EASE,
                               #             unclamped. Newton path only; asked for elsewhere it is
                               #             refused rather than silently not run.
                               #   fixed     dt exactly as given below
    dt: 31536000               # seconds per timestep (31536000 = 1 year). The step lives HERE, not
                               # under time:, because it is a solver property; time: keeps the run's
                               # clock -- how long, how often to report -- which is quantised BY the
                               # step but does not choose it. Under mode: adaptive or ramp this is
                               # the STARTING step; report_interval x deltat is always the report
                               # span the run must land on exactly.
    dt_min: "315.36s"         # the SMALLEST step the controller may take. REQUIRED whenever you write
                               # mode: adaptive above -- there is no default, and the absence is deliberate.
                               # 
                               # WHY YOU ARE BEING ASKED. Every code surveyed does one of two things, and
                               # neither is "guess for the user": SUNDIALS and PETSc ship NO floor, letting
                               # the controller shrink without bound; MODFLOW 6 and ParFlow REQUIRE you to
                               # state one as part of opting into adaptive stepping. WTM follows the second.
                               # The floor is not a safety device -- an unconditional roundoff guard already
                               # aborts a run whose step has collapsed to where t + dt == t, and it cannot be
                               # switched off. What the floor decides is how much ACCURACY the run may lose
                               # in silence, because a step clamped here runs LOOSER than error_tol asked
                               # for. That is a policy, so it is yours.
                               # 
                               # CHOOSING ONE. 1e-5 of your dt is the usual answer and what is written here
                               # (1e-5 x 31536000 s = 315.36 s). That RATIO is WTM's own scale-free choice, so
                               # the floor keeps the same margin below the step at any step size. It is NOT
                               # MODFLOW 6's recommendation: MODFLOW's 1e-5 is an ABSOLUTE length in model time
                               # units, advised so simulated time lands on stress-period ends -- an alignment
                               # concern WTM does not have, since it reaches a report boundary by clamping.
                               # What MODFLOW 6 and ParFlow ARE cited for is requiring a floor, not shipping one.
                               #
                               # Five orders below the step, it cannot
                               # engage on a healthy run; it engages on one already walking dt toward abort.
                               # 
                               # dt_min: "0s" DISABLES the floor -- the SUNDIALS/PETSc behaviour, and a real
                               # choice rather than an opt-out. The controller may then shrink without bound,
                               # and a collapsing step ABORTS with a legible message instead of being clamped
                               # and carried on. Prefer it when you would rather a run die than quietly
                               # return an answer at an accuracy you did not ask for.
                               # 
                               # WHEN IT BINDS THE RUN SAYS SO, in ordinary output rather than under a trace
                               # flag: "N step(s) CLAMPED at solver.time_step.dt_min ... those steps ran at
                               # accuracy LOOSER than solver.time_step.error_tol". Silence there would let a
                               # run report a tolerance it did not meet.
                               # 
                               # OMITTING mode: adaptive above does NOT require this key -- a mode WTM
                               # resolves for you gets no floor. The requirement attaches to the explicit
                               # request, exactly as MODFLOW's attaches to adding the ATS package.
#   error_tol:                 # target per-step local error, in metres of WATER like
                               # run.equilibrium_stop.tol -- an absolute depth, not a ratio.
                               # OMIT to track run.equilibrium_stop.tol, which is the derivation that
                               # matters: a step should resolve what the run cares about. Middle of the
                               # three gates. Setting it looser than the run's tol means stopping on
                               # steps the run cannot resolve.
                               #
                               # IT DOES NOT BOUND THE ERROR OF THE ANSWER. It is a PER-STEP LOCAL
                               # target; the path error accumulates over the steps taken and is much
                               # larger. Measured on a 16x16 transient fixture with lakes: the achieved
                               # error exceeded error_tol by 12-37x across 0.02..0.5 m. Setting 0.1 does
                               # not buy a decimetre answer. Treat it as a step-size dial, not an
                               # accuracy guarantee -- see benchmark/BDF2_ADAPTIVE_DESIGN.md sec. 3.5.
#   dt_max:                    # cap on the step. OMIT for 1000 * time.deltat.
    grow: 1.5                  # dt multiplier after an easy solve
    shrink: 0.25               # dt multiplier after a rejected solve
    grow_if_niter_leq: 8       # grow only when the solve took at most this many nonlinear iterations.
                               # A SOLVABILITY gate, not an accuracy one: a step can be accurate and
                               # still sit near the free-boundary ceiling, where a larger dt overshoots
                               # into a singular Jacobian. Inclusive -- a solve of exactly 8 still grows.
    max_retries: 15            # consecutive rejected steps before the run aborts
    norm: rms                  # how the step error is measured: rms | max. rms is robust on cold
                               # spin-up; max is hostage to a few surface-kink cells whose spike does
                               # not shrink with dt.

  smoothing:                   # widths that ROUND a kink in the coefficients [m]
    ksat_surface: 0            # the conductivity clamp at wtd = 0; 0 = sharp
    ksat_soilbottom: 0         # the conductivity change at the -1.5 m soil boundary; 0 = sharp
                               # Both ksat_* exist so a Jacobian finite-difference check has a smooth
                               # tangent, and are OFF in a normal run.
    storativity_surface: 0.01  # the storativity transition at the surface. UNLIKE the two above this
                               # is ON by default and is physics: sub-grid roughness, not a check tool.

  anderson:                    # read only on the matrix-free Anderson path
    restart:                   # restart Anderson's history when the convergence RATE degrades
      enabled: false
      rho: 0.9                 # restart once the observed rate exceeds this...
      patience: 2              # ...for this many consecutive iterations
      max_it: 40               # cap per Anderson phase before a forced restart
      max_restarts: 30         # outer restart cap

  newton:                      # read only on the Newton path
#   dt0:                       # starting dt for the mode: ramp continuation. OMIT for the default below.
                               # default = time.deltat / 200 -- small, so the storage term S/deltat keeps
                               # the Jacobian diagonally dominant; a large step from a far guess
                               # overshoots into a singular Jacobian that fails even a direct solve.

parallel:
  threads_per_rank: 1          # OpenMP threads per MPI rank (1 = pure MPI). Rank count is set at launch (mpirun -n).

# dev (experimental; off by default):
# dev:
#   under_relaxation: 1.0      # 1.0 = off. Damps the committed step: w <- a*w_solve + (1-a)*w_prev,
#                              # over the WHOLE grid. Built to damp free-boundary flicker, which was
#                              # later diagnosed as largely a per-sub-step vs per-cycle metric artifact
#                              # -- so reach for it only if you see real oscillation. Voids a TRANSIENT
#                              # trajectory (you step a damped surrogate); the equilibrium fixed point
#                              # is unchanged. Measured cost at 0.5: 2x the solves.
